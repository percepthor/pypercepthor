[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# no cache: the package is bind-mounted, a run never writes into the tree
addopts = -v --tb=short --strict-markers --disable-warnings -p no:cacheprovider

# e2e needs auth-service with its MongoDB and Redis: ./run.sh e2e
testpaths = unit integration

markers =
	unit: pure tests of the package over the real libcerver and libauth
	integration: a real cerver, created and compiled but never started
	e2e: a started cerver that authenticates against a real auth-service
	fuzz: property tests with hypothesis
	slow: tests that take more than a few seconds
