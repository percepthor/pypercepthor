[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "percepthor"
dynamic = ["version"]
description = "Common Percepthor Development Module, the Python wrapper of libauth over pycerver"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{ name = "Erick Salas", email = "erick.salas@ermiry.com" }
]
dependencies = [
	"pycerver>=1.0"
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Typing :: Typed"
]

[tool.setuptools.dynamic]
version = { attr = "percepthor.version.PERCEPTHOR_VERSION" }

[tool.setuptools.packages.find]
include = ["percepthor", "percepthor.*"]

[tool.setuptools.package-data]
percepthor = ["py.typed"]
